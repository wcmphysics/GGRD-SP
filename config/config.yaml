# yaml-language-server: $schema=config.schema.json
# Pipeline configuration for GGRD-SP

global:
  material: "NMG"
  # Model architecture: resnet, resnet_scaled_short, unet, residual_unet, deeplabv3, inception_time, tcn, fpn
  model_type: "resnet"
  use_sliding_window: false
  use_film: false
  apply_denoise: false
  unified_model: true
  source_tool: "J4"
  target_tool: "J5"
  example_region: "Ti2p"
  sample_measurement_id: "NMG_M_J4_00000"

pairing:
  time_threshold_hours: 8.0
  method: "optimal"

normalization:
  normalization_mode: "by_regional_max_intensity_of_source"
  eps: 0.000001

splitting:
  method: "random"
  train_ratio: 0.5
  val_ratio: 0.2
  test_ratio: 0.3
  seed: null

dataset:
  window_size_ev: 3.0
  sliding_stride_ev: 1.0
  region_configs:
    Al2p:
      window_size_ev: 3.0
      sliding_stride_ev: 1.0

cost:
  w_mse: 1.0
  w_shape: 0.0
  w_gradient: 0.0
  l2_weight: 0.000001
  normalized_by_target_max: true

noise_analysis:
  method: "gp"
  splits: null
  dies: [0]
  batch_size: 64
  unpaired_split: "train"
  kernel:
    type: "matern52"
    initial_lengthscale_ev: 1.0
  noise_model: "homoscedastic"
  confidence_type: "observation"
  training:
    num_iterations: 50
    learning_rate: 0.2

noise_plot:
  plots:
    - "noise_vs_time"
    - "snr_by_region"
    - "noise_heatmap"
    - "example_spectrum"

# Note: Model-dedicated configurations (training, bayesian_opt, film) are managed in
# dedicated config files under config/ (e.g., config/resnet.yaml, config/inception_time.yaml).
# Specific keys can be overridden here if needed.
film: {}

bayesian_opt: {}

training:
  train_config: {}
  region_configs: {}

prediction:
  clamp_non_negative: true

metrics_report:
  splits:
    - "train"
    - "test"
  metrics:
    - "peak_error_percentage"
    - "chebyshev_error_peak_normalized_percentage"

quantification:
  rsf_table:
    C1s: 1.000
    Al2p: 0.537
    Ti2p: 7.910
    O1s: 2.930
    Cl2p: 2.285
    N1s: 1.800
    Si2p: 0.817
  default_endpoint_strategy: "minima"
  default_endpoint_average_ev: 1.0
  max_iter: 50
  tol: 0.00001

visualization:
  show_plots: true
  plots:
    gp_die_flux_timeline: false
    gp_die_flux_kernel_contributions: false
    pairing_timeline: false
    flux_and_averaged_intensity: false
    max_intensity: false
    normalized_max_intensity: false
    tool_comparison: false
    shirley_background: false
    spectral_noise_analysis: false
    gp_hyperparameter_convergence: false
    training_history: true
    prediction_comparison: true
    regional_spectrum_distribution: false
    atomic_percentage_distributions: false
    atomic_percentage_mae: true
    sliding_window_slices: true
    denoise_spectrum_comparison: false
    denoise_atomic_percentage_mae: false
