# yaml-language-server: $schema=config.schema.json
# Pipeline and material configuration for GGRD-SP

materials:
  NMG:
    elements:
      - Ti
      - Al
      - C
      - O
      - Cl
      - Si
  PMG:
    elements:
      - Ti
      - N
      - O
      - Cl
      - Si

global:
  material: "NMG"
  # Model architecture: resnet, resnet_scaled_short, unet, residual_unet, deeplabv3, inception_time, tcn, fpn
  model_type: "resnet"
  use_sliding_window: false
  use_film: false
  apply_denoise: false
  unified_model: true
  source_tool: "J4"
  target_tool: "J5"
  example_region: "Ti2p"
  sample_measurement_id: "NMG_M_J4_00000"

data_generation:
  regions:
    - "Al2p"
    - "Ti2p"
    - "O1s"
    - "C1s"
    - "Cl2p"
  region_relative_strengths:
    Al2p: 5.0
    Ti2p: 7.0
    O1s: 10.0
    C1s: 8.0
    Cl2p: 1.0
  n_points: 100
  measurements_per_tool:
    J4: 25
    J5: 30
  measurements_per_t7_code: 10
  interval_hours_range: [4.0, 24.0]
  die_variation_std: 0.03
  noise_relative_std: 0.015
  seed: null
  tool_offsets:
    J4:
      shift_ev: 0.0
      scale: 10000.0
    J5:
      shift_ev: 1.1
      scale: 14000.0
  shirley_background:
    enabled: true
    step_ratio: 0.10

pairing:
  time_threshold_hours: 8.0
  method: "optimal"

normalization:
  normalization_mode: "by_regional_max_intensity_of_source"
  eps: 0.000001

splitting:
  method: "random"
  train_ratio: 0.5
  val_ratio: 0.2
  test_ratio: 0.3
  seed: null

gp_flux:
  reference_date: "2026-01-01"
  unpaired_split: "train"
  target_column: "total_flux_single_die"
  kernel:
    time_continuous:
      type: "rbf"
      initial_lengthscale: 5.0
    time_jump:
      enabled: true
      initial_step_time_days: 10.0
      initial_steepness: 2.0
      learn_step_time: true
    die:
      type: "index"
      num_dies: 9
      rank: 2
    composition: "product_with_jump"
  training:
    num_iterations: 150
    learning_rate: 0.05
  plot:
    plot_die: 0

dataset:
  window_size_ev: 3.0
  sliding_stride_ev: 1.0
  region_configs:
    Al2p:
      window_size_ev: 3.0
      sliding_stride_ev: 1.0

cost:
  w_mse: 1.0
  w_shape: 0.0
  w_gradient: 0.0
  l2_weight: 0.000001
  normalized_by_target_max: true

noise_analysis:
  method: "gp"
  splits: null
  dies: [0]
  batch_size: 64
  unpaired_split: "train"
  kernel:
    type: "matern52"
    initial_lengthscale_ev: 1.0
  noise_model: "homoscedastic"
  confidence_type: "observation"
  training:
    num_iterations: 50
    learning_rate: 0.2

denoise:
  method: "savgol"
  regions:
    - "Cl2p"
    - "Ti2p"
  apply_to: "both"
  savgol:
    window_length: 11
    polynomial_order: 3
    boundary_mode: "interp"
  wavelet:
    transform_type: "stationary"
    wavelet_name: "sym4"
    decomposition_level: 2
    threshold_mode: "soft"
    threshold_rule: "universal"
    threshold_scale: 1.0
  fourier:
    filter_type: "dct"
    cutoff_ratio: 0.25
    filter_order: 4
    rolloff_type: "butterworth"
    padding_mode: "even"
  gp:
    kernel:
      type: "matern52"
      initial_lengthscale_ev: 1.0
    noise_model: "homoscedastic"
    confidence_type: "observation"
    training:
      num_iterations: 50
      learning_rate: 0.2
  region_configs:
    Cl2p:
      method: "savgol"
      savgol:
        window_length: 11
        polynomial_order: 3
    Ti2p:
      method: "savgol"
      savgol:
        window_length: 9
        polynomial_order: 3

noise_plot:
  plots:
    - "noise_vs_time"
    - "snr_by_region"
    - "noise_heatmap"
    - "example_spectrum"

# Note: Model-dedicated configurations (training, bayesian_opt, film) are managed in
# dedicated config files under config/ (e.g., config/resnet.yaml, config/inception_time.yaml).
# Specific keys can be overridden here if needed.
film: {}

bayesian_opt: {}

training:
  train_config: {}
  region_configs: {}

prediction:
  clamp_non_negative: true

metrics_report:
  splits:
    - "train"
    - "test"
  metrics:
    - "peak_error_percentage"
    - "chebyshev_error_peak_normalized_percentage"

quantification:
  rsf_table:
    C1s: 1.000
    Al2p: 0.537
    Ti2p: 7.910
    O1s: 2.930
    Cl2p: 2.285
    N1s: 1.800
    Si2p: 0.817
  default_endpoint_strategy: "minima"
  default_endpoint_average_ev: 1.0
  max_iter: 50
  tol: 0.00001

visualization:
  show_plots: true
  plots:
    gp_die_flux_timeline: false
    pairing_timeline: false
    flux_and_averaged_intensity: false
    max_intensity: false
    normalized_max_intensity: false
    tool_comparison: false
    shirley_background: false
    spectral_noise_analysis: false
    gp_hyperparameter_convergence: false
    training_history: true
    prediction_comparison: true
    regional_spectrum_distribution: false
    atomic_percentage_distributions: false
    atomic_percentage_mae: true
    sliding_window_slices: true
    denoise_spectrum_comparison: true
    denoise_atomic_percentage_mae: true
