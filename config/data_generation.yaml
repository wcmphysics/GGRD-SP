# Configuration for pseudo-measurement spectral data generation
data_generation:
  regions:
    - "Al2p"
    - "Ti2p"
    - "O1s"
    - "C1s"
    - "Cl2p"
  region_relative_strengths:
    Al2p: 5.0
    Ti2p: 7.0
    O1s: 10.0
    C1s: 8.0
    Cl2p: 1.0
  n_points: 100
  measurements_per_tool:
    J4: 25
    J5: 30
  measurements_per_t7_code: 10
  interval_hours_range: [4.0, 24.0]
  die_variation_std: 0.03
  noise_relative_std: 0.015
  seed: null
  tool_offsets:
    J4:
      shift_ev: 0.0
      scale: 10000.0
    J5:
      shift_ev: 1.1
      scale: 14000.0
  shirley_background:
    enabled: true
    step_ratio: 0.10
